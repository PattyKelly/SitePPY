{% extends "base.html" %}

{% block title %}Login - SitePPY{% endblock %}

{% block content %}
<div class="container">
    <div class="login-container">
        <div class="login-box">
            <h2>Acesso Personal</h2>
            <p class="login-subtitle">Entre com suas credenciais</p>
            
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>
            
            <div class="demo-info">
                <p><strong>Credenciais de demonstração:</strong></p>
                <p>Usuário: <code>admin</code> / Senha: <code>admin123</code></p>
                <p>Usuário: <code>user</code> / Senha: <code>user123</code></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
